[workspace]
members = [
    "crates/ipc",
    "crates/shell-model",
    "crates/daemon",
]
resolver = "2"
exclude = ["apps/linux"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"
version = "0.1.0"

[workspace.dependencies]
async-trait = "=0.1.83"
bytes = "=1.7.2"
getrandom = "=0.2.15"
prost = "=0.13.3"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
sha2 = "=0.10.8"
tempfile = "=3.13.0"
thiserror = "=1.0.64"
tokio = { version = "=1.40.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
