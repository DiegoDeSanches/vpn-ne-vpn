name: OnionRouteMobile
options:
  bundleIdPrefix: org.onionroute
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    HEADER_SEARCH_PATHS: "$(SRCROOT)/../../crates/mobile-ffi/include"
    LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Frameworks"
    OTHER_LDFLAGS: "$(inherited) -lonionroute_mobile_ffi"
targets:
  OnionRouteApp:
    type: application
    platform: iOS
    sources:
      - OnionRouteApp
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.onionroute.mobile
        CODE_SIGN_ENTITLEMENTS: OnionRouteApp/OnionRouteApp.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: OnionRouteApp/Support/OnionRoute-Bridging-Header.h
        INFOPLIST_FILE: OnionRouteApp/Info.plist
    dependencies:
      - target: PacketTunnel
        embed: true
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - PacketTunnel
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.onionroute.mobile.PacketTunnel
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: OnionRouteApp/Support/OnionRoute-Bridging-Header.h
        INFOPLIST_FILE: PacketTunnel/Info.plist
  OnionRouteAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: OnionRouteApp
