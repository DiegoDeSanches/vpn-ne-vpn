[package]
name = "onionroute-auth-tokens"
version = "0.1.0"
description = "Experimental anonymous capability tokens for the OnionRoute data plane"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"

# Standalone until docs/contract-proposals/CP-0007 is accepted.
[workspace]
members = ["."]
exclude = ["fuzz"]
resolver = "2"

[dependencies]
async-trait = "=0.1.80"
ed25519-dalek = { version = "=2.1.1", features = ["zeroize"] }
getrandom = "=0.2.15"
prost = "=0.12.6"
sha2 = "=0.10.8"
thiserror = "=1.0.61"

[dev-dependencies]
tokio = { version = "=1.37.0", features = ["macros", "rt-multi-thread"] }
