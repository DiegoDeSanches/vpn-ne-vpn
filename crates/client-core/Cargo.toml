[package]
name = "onionroute-client-core"
version = "0.1.0"
description = "Runtime-neutral OnionRoute client network core"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"

# Temporary standalone workspace until CP-0001 is accepted.
[workspace]

[features]
default = []
test-utils = ["onionroute-common-types/test-utils"]

[dependencies]
onionroute-common-types = { path = "../common-types" }
onionroute-dns-engine = { path = "../dns-engine" }
onionroute-packet-engine = { path = "../packet-engine" }
onionroute-policy-engine = { path = "../policy-engine" }

[dev-dependencies]
onionroute-common-types = { path = "../common-types", features = ["test-utils"] }

[[bench]]
name = "core_pipeline"
harness = false
