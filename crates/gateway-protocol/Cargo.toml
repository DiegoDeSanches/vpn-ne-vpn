[package]
name = "onionroute-gateway-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
description = "Bounded OnionRoute gateway v1 framing and multiplexed transport"

[dependencies]
getrandom = "=0.2.15"
prost = "=0.12.6"
sha2 = "=0.10.8"
thiserror = "=1.0.61"
tokio = { version = "=1.37.0", features = ["io-util", "time"] }

[dev-dependencies]
proptest = "=1.5.0"
tempfile = "=3.10.1"
tokio = { version = "=1.37.0", features = ["io-util", "macros", "rt-multi-thread", "time"] }

[build-dependencies]
indexmap = "=2.2.6"
prost-build = "=0.12.6"
protoc-bin-vendored = "=3.0.0"

[workspace]
members = ["."]
exclude = ["fuzz"]
resolver = "2"
