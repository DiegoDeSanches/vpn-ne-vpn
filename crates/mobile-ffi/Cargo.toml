[package]
name = "onionroute-mobile-ffi"
version = "0.1.0"
description = "Experimental stable C ABI for OnionRoute mobile clients"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
onionroute-client-core = { path = "../client-core" }
onionroute-common-types = { path = "../common-types" }
onionroute-packet-engine = { path = "../packet-engine" }
tokio = { version = "=1.38.0", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
onionroute-common-types = { path = "../common-types", features = ["test-utils"] }
onionroute-dns-engine = { path = "../dns-engine" }
