[package]
name = "onionroute-mobile-ffi"
version = "0.1.0"
description = "Experimental stable C ABI for OnionRoute mobile clients"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"

# Temporary standalone workspace until CP-0006 is accepted. The protected root
# workspace manifest is intentionally not changed by the mobile team.
[workspace]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
onionroute-client-core = { path = "../client-core" }

