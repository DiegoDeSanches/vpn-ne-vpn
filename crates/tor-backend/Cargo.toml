[package]
name = "onionroute-tor-backend"
version = "0.1.0"
description = "Managed C Tor backend and experimental Arti boundary for OnionRoute"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"

# Temporary standalone workspace until CP-0001 is accepted.
[workspace]

[features]
default = []
test-utils = ["onionroute-common-types/test-utils"]
embedded-ctor = ["dep:onionroute-embedded-ctor-sys"]
embedded-ctor-native = ["embedded-ctor", "onionroute-embedded-ctor-sys/native"]

[dependencies]
hex = "=0.4.3"
hmac = "=0.12.1"
onionroute-common-types = { path = "../common-types" }
onionroute-embedded-ctor-sys = { path = "../embedded-ctor-sys", optional = true }
rand = "=0.8.5"
sha2 = "=0.10.8"
subtle = "=2.5.0"
tempfile = "=3.10.1"
tokio = { version = "=1.38.0", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.11", features = ["rt"] }

[dev-dependencies]
onionroute-common-types = { path = "../common-types", features = ["test-utils"] }
tokio = { version = "=1.38.0", features = ["macros", "rt-multi-thread", "time"] }

[[bin]]
name = "onionroute-mock-tor"
path = "src/bin/mock_tor_daemon.rs"
required-features = ["test-utils"]
