---
- name: Build hardened OnionRoute role image
  hosts: all
  become: true
  gather_facts: true
  pre_tasks:
    - name: Validate immutable image inputs
      ansible.builtin.assert:
        that:
          - onionroute_node_role is defined
          - onionroute_node_role in onionroute_allowed_roles
          - onionroute_release_version is defined
          - onionroute_release_version is match('^[0-9A-Za-z][0-9A-Za-z._-]{0,63}$')
          - onionroute_release_digest is defined
          - onionroute_release_digest is match('^sha256:[0-9a-f]{64}$')
          - onionroute_dns_v4 | length >= 1
          - onionroute_dns_v4 | length <= 4
          - onionroute_ntp_v4 | length >= 1
          - onionroute_ntp_v4 | length <= 4
          - onionroute_dependency_v4 | length <= 64
          - onionroute_next_hop_v4 | length <= 64
          - onionroute_management_v4 | length <= 64
          - onionroute_next_hop_port | int >= 1
          - onionroute_next_hop_port | int <= 65535
          - onionroute_dns_v4 | select('match', '^[0-9]{1,3}(\.[0-9]{1,3}){3}$') | list | length == onionroute_dns_v4 | length
          - onionroute_ntp_v4 | select('match', '^[0-9]{1,3}(\.[0-9]{1,3}){3}$') | list | length == onionroute_ntp_v4 | length
          - onionroute_dependency_v4 | select('match', '^[0-9]{1,3}(\.[0-9]{1,3}){3}$') | list | length == onionroute_dependency_v4 | length
          - onionroute_next_hop_v4 | select('match', '^[0-9]{1,3}(\.[0-9]{1,3}){3}$') | list | length == onionroute_next_hop_v4 | length
          - onionroute_management_v4 | select('match', '^[0-9]{1,3}(\.[0-9]{1,3}){3}(/[0-9]{1,2})?$') | list | length == onionroute_management_v4 | length
        fail_msg: Refusing to build an unpinned or unsupported role image.
  roles:
    - base_hardening
    - onionroute_node
    - vault_agent
