syntax = "proto3";

package onionroute.gateway.v1;

// Stable coarse codes only. Destination, token, payload, account, device, and
// payment identifiers are forbidden in protocol errors.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_PROTOCOL_INCOMPATIBLE = 1;
  ERROR_CODE_PROTOCOL_VIOLATION = 2;
  ERROR_CODE_MESSAGE_TOO_LARGE = 3;
  ERROR_CODE_AUTHENTICATION_FAILED = 4;
  ERROR_CODE_POLICY_DENIED = 5;
  ERROR_CODE_RESOURCE_EXHAUSTED = 6;
  ERROR_CODE_UNAVAILABLE = 7;
  ERROR_CODE_TIMEOUT = 8;
  ERROR_CODE_STREAM_CLOSED = 9;
  ERROR_CODE_INTERNAL = 10;
  ERROR_CODE_UNSUPPORTED = 11;
  ERROR_CODE_SESSION_ROTATING = 12;
}

enum AnonymityMode {
  ANONYMITY_MODE_UNSPECIFIED = 0;
  ANONYMITY_MODE_STANDARD = 1;
  ANONYMITY_MODE_ENHANCED = 2;
  ANONYMITY_MODE_MAXIMUM = 3;
  ANONYMITY_MODE_DIRECT_TOR = 4;
}

enum AddressFamily {
  ADDRESS_FAMILY_UNSPECIFIED = 0;
  ADDRESS_FAMILY_IPV4 = 1;
  ADDRESS_FAMILY_IPV6 = 2;
  ADDRESS_FAMILY_ANY = 3;
}

enum RotationReason {
  ROTATION_REASON_UNSPECIFIED = 0;
  ROTATION_REASON_MANUAL = 1;
  ROTATION_REASON_SCHEDULED = 2;
  ROTATION_REASON_POLICY = 3;
}

enum CloseCode {
  CLOSE_CODE_UNSPECIFIED = 0;
  CLOSE_CODE_FINISHED = 1;
  CLOSE_CODE_CANCELLED = 2;
  CLOSE_CODE_TIMEOUT = 3;
  CLOSE_CODE_PROTOCOL = 4;
  CLOSE_CODE_POLICY = 5;
  CLOSE_CODE_RESOURCE_EXHAUSTED = 6;
  CLOSE_CODE_INTERNAL = 7;
}
