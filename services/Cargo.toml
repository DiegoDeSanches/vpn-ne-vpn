[workspace]
members = [
    "directory-service",
    "health-collector",
    "admin-api",
    "signing-service",
    "revocation-service",
]
exclude = ["token-service"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"
version = "0.1.0"

[workspace.dependencies]
ahash = "=0.8.11"
async-trait = "=0.1.80"
axum = "=0.7.5"
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.1.1", features = ["rand_core", "zeroize"] }
http-body-util = "=0.1.1"
home = "=0.5.9"
parking_lot = "=0.12.3"
parking_lot_core = "=0.9.10"
semver = "=1.0.23"
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
serde_jcs = "=0.1.0"
sqlx = { version = "=0.7.4", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "json"] }
thiserror = "=1.0.61"
tokio = { version = "=1.38.0", features = ["macros", "rt-multi-thread", "net", "signal", "fs"] }
tower = { version = "=0.5.2", features = ["util"] }
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter", "fmt"] }
zeroize = "=1.8.1"
